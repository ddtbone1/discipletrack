# Gradle JVM sizing.
#
# The Flutter template ships -Xmx8G with a 4G metaspace, which assumes a large
# development machine. On a host with less physical RAM than that, the Kotlin
# compiler daemon is starved and fails to flush and close its incremental
# caches, surfacing as:
#
#   Could not close incremental caches in build/<plugin>/kotlin/...
#
# 2G heap plus 512m metaspace builds this project comfortably. Raise it only if
# a build actually reports OutOfMemoryError.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Keep the daemon from lingering and holding file handles between builds on a
# memory-constrained host.
org.gradle.daemon=true
org.gradle.parallel=false

# Kotlin incremental compilation is disabled because it is broken in this
# toolchain. It registers the same cache file twice and then throws while
# closing it:
#
#   IllegalStateException: Storage for [...class-fq-name-to-source.tab]
#     is already registered
#       at FilePageCache.registerPagedFileStorage
#       at IncrementalCompilerRunner.compileNonIncrementally
#
# The compile itself succeeds; only the cache teardown fails, which still fails
# the build. Incremental compilation is a build-speed optimization, so turning
# it off costs a little time per build and nothing else. Revisit when the
# Kotlin Gradle plugin is next upgraded.
kotlin.incremental=false

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
